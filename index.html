<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gerbang Scan QR - Wisuda UIN Ar-Raniry</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/html5-qrcode" type="text/javascript"></script>
  <style>
    body { background-color: #121212; color: #fff; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
    #reader { width: 100%; max-width: 450px; margin: 0 auto; border-radius: 16px; overflow: hidden; border: 3px solid #198754; background: #000; }
    .scan-card { background: #1e1e1e; border-radius: 20px; border: 1px solid #333; }
  </style>
</head>
<body class="d-flex flex-column min-vh-100 justify-content-center align-items-center p-3">

  <div class="container" style="max-width: 600px;">
    <div class="text-center mb-3">
      <h4 class="fw-bold text-success mb-1"><i class="fa-solid fa-qrcode me-2"></i>Gerbang Utama Auditorium</h4>
      <p class="text-muted small">Pemindai Undangan Tamu Wisuda (1 Wisudawan = 1 Tamu)</p>
    </div>

    <div class="card scan-card shadow-lg p-3 mb-3">
      <div id="reader"></div>
      
      <div id="scanResult" class="mt-3 text-center">
        <div class="alert alert-dark border-secondary py-3 mb-0 text-white">
          <i class="fa-solid fa-camera fa-beat text-success me-2"></i> Arahkan kamera HP ke QR Code undangan tamu...
        </div>
      </div>
    </div>

    <div class="text-center text-secondary" style="font-size: 11px;">
      UIN Ar-Raniry Banda Aceh • Terhubung ke Google Sheets Master
    </div>
  </div>

  <script>
    let lastScannedNim = "";
    let lastScanTime = 0;
    let isProcessing = false;

    const APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbzUvI4_am-sXkw_eG_f00JcLNGzkLYC1KOUdHpjVDt7xI7J_K4lbdcFUjsWjVf39Ll-fA/exec";

    function onScanSuccess(decodedText, decodedResult) {
      const now = new Date().getTime();
      if (decodedText === lastScannedNim && (now - lastScanTime) < 3000) return;
      if (isProcessing) return;

      lastScannedNim = decodedText;
      lastScanTime = now;
      isProcessing = true;

      playBeep();

      document.getElementById('scanResult').innerHTML = `
        <div class="alert alert-info py-3 mb-0">
          <div class="spinner-border spinner-border-sm me-2"></div>Memeriksa NIM: <b>${decodedText}</b>...
        </div>`;

      fetch(`${APPS_SCRIPT_URL}?nim=${encodeURIComponent(decodedText)}&action=scan`, {
        method: 'GET',
        mode: 'cors',
        headers: { 'Accept': 'application/json' }
      })
        .then(response => response.json())
        .then(res => {
          renderResultBox(res);
          setTimeout(() => { isProcessing = false; }, 2000);
        })
        .catch(err => {
          document.getElementById('scanResult').innerHTML = `
            <div class="alert alert-danger py-3 mb-0">
              <i class="fa-solid fa-triangle-exclamation me-2"></i> Gagal terhubung: ${err.message}
            </div>`;
          isProcessing = false;
        });
    }

    function renderResultBox(res) {
      const box = document.getElementById('scanResult');
      if (res.success) {
        box.innerHTML = `
          <div class="alert alert-success py-3 shadow mb-0 fs-6">
            <i class="fa-solid fa-circle-check me-2"></i> <b>${res.message}</b>
            <div class="small mt-1 text-dark">Waktu: ${res.data.waktu}</div>
          </div>`;
      } else {
        box.innerHTML = `
          <div class="alert alert-danger py-3 shadow mb-0 fs-6">
            <i class="fa-solid fa-circle-xmark me-2"></i> <b>${res.message}</b>
          </div>`;
      }
    }

    function playBeep() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.type = 'sine';
        osc.frequency.value = 850;
        gain.gain.setValueAtTime(0.1, ctx.currentTime);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    const html5QrCode = new Html5Qrcode("reader");
    html5QrCode.start(
      { facingMode: "environment" },
      { fps: 15, qrbox: { width: 220, height: 220 } },
      onScanSuccess
    ).catch(err => {
      document.getElementById('scanResult').innerHTML = `
        <div class="alert alert-danger small">
          <b>Kamera gagal diakses:</b> ${err}<br>Pastikan memberi izin akses kamera pada browser HP Anda.
        </div>`;
    });
  </script>
</body>
</html>
